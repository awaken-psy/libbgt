default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.4.0
    hooks:
      - id: clang-format
        name: clang-format
        stages: [pre-commit]
        args:
          - --style=file
          - --version=22

      - id: clang-tidy
        name: clang-tidy
        stages: [pre-push]
        args:
          - --checks=.clang-tidy
          - -p=build
          - --version=22
